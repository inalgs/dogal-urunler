<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetim - Doğal Ürünler</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="slogan-banner">
    <div class="slogan-text">
      <span>Emekten Bereket, Gelenekten Gelecek</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><i class="bi bi-tree" style="color:#8bc34a;font-size:1.8rem"></i> Doğal<span>Ürünler</span></a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/products.html">Ürünler</a></li>
        <li><a href="/blog.html">Blog</a></li>
        <li><a href="/about.html">Hakkımızda</a></li>
      </ul>
      <div class="nav-actions"></div>
      <button class="mobile-toggle" onclick="toggleMobileMenu()"><i class="bi bi-list"></i></button>
    </div>
  </nav>

  <div class="page-header">
    <h1><i class="bi bi-cart3"></i> Sepetim</h1>
  </div>

  <section class="section">
    <div class="container">
      <div id="cartContent">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">

      <div class="footer-bottom">&copy; 2026 DoğalÜrünler. Tüm hakları saklıdır.</div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    async function loadCart() {
      if (!Auth.isLoggedIn()) {
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-state">
            <i class="bi bi-cart-x"></i>
            <h3>Sepetinizi görmek için giriş yapın</h3>
            <a href="/login.html" class="btn btn-primary">Giriş Yap</a>
          </div>`;
        return;
      }

      try {
        const data = await API.get('/cart');
        const container = document.getElementById('cartContent');

        if (data.items.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="bi bi-cart-x"></i>
              <h3>Sepetiniz boş</h3>
              <p>Hemen alışverişe başlayın!</p>
              <a href="/products.html" class="btn btn-primary">Ürünlere Git</a>
            </div>`;
          return;
        }

        container.innerHTML = `
          <table class="cart-table">
            <thead>
              <tr>
                <th>Ürün</th>
                <th>Fiyat</th>
                <th>Miktar</th>
                <th>Toplam</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${data.items.map(item => `
                <tr>
                  <td data-label="Ürün">
                    <div class="cart-item-info">
                      ${item.image
                        ? `<img src="${item.image}" alt="${item.name}" class="cart-item-image">`
                        : `<div class="cart-item-image" style="display:flex;align-items:center;justify-content:center"><i class="bi bi-image"></i></div>`}
                      <a href="/product-detail.html?slug=${item.slug}" style="font-weight:700">${item.name}</a>
                    </div>
                  </td>
                  <td data-label="Fiyat">${formatPrice(item.price)}</td>
                  <td data-label="Miktar">
                    <div class="quantity-control">
                      <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                      <span>${item.quantity}</span>
                      <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                    </div>
                  </td>
                  <td data-label="Toplam" style="font-weight:700">${formatPrice(item.price * item.quantity)}</td>
                  <td>
                    <button class="btn btn-sm" style="color:var(--error)" onclick="removeItem(${item.id})">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div class="cart-summary">
            <div class="cart-summary-total">
              <span>Toplam</span>
              <span>${formatPrice(data.total)}</span>
            </div>
            <div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap">
              <a href="/products.html" class="btn btn-outline">Alışverişe Devam Et</a>
              <a href="/checkout.html" class="btn btn-primary btn-lg">Siparişi Tamamla <i class="bi bi-arrow-right"></i></a>
            </div>
          </div>
        `;
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function updateQuantity(id, qty) {
      if (qty < 1) return removeItem(id);
      try {
        await API.put(`/cart/${id}`, { quantity: qty });
        loadCart();
        updateCartBadge();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function removeItem(id) {
      try {
        await API.delete(`/cart/${id}`);
        showToast('Ürün sepetten silindi');
        loadCart();
        updateCartBadge();
      } catch (e) { showToast(e.message, 'error'); }
    }

    loadCart();
  </script>
</body>
</html>
