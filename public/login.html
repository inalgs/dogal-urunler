<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - Doğal Ürünler</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="slogan-banner">
    <div class="slogan-text">
      <span>Emekten Bereket, Gelenekten Gelecek</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><i class="bi bi-tree" style="color:#8bc34a;font-size:1.8rem"></i> Doğal<span>Ürünler</span></a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/products.html">Ürünler</a></li>
      </ul>
      <div class="nav-actions"></div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Giriş Yap</h2>
      <p class="subtitle">Hesabınıza giriş yapın</p>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" class="form-control" id="email" placeholder="ornek@email.com" required>
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" class="form-control" id="password" placeholder="Şifrenizi girin" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Giriş Yap</button>
      </form>
      <div class="switch-link">
        Hesabınız yok mu? <a href="/register.html">Kayıt Ol</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      try {
        const data = await API.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        Auth.login(data.token, data.user);
        showToast('Giriş başarılı!');
        setTimeout(() => window.location.href = '/', 500);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
