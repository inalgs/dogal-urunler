<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürünler - Ankazen</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="slogan-banner">
    <div class="slogan-text">
      <span>Emekten Bereket, Gelenekten Gelecek</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><img src="/images/logo.jpg" alt="Ankazen" class="navbar-logo"></a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/products.html">Ürünler</a></li>
        <li><a href="/blog.html">Blog</a></li>
        <li><a href="/about.html">Hakkımızda</a></li>
        <li><a href="/contact.html">İletişim</a></li>
      </ul>
      <div class="nav-actions"></div>
      <button class="mobile-toggle" onclick="toggleMobileMenu()"><i class="bi bi-list"></i></button>
    </div>
  </nav>

  <div class="page-header">
    <h1>Ürünlerimiz</h1>
    <p>Doğal ve katkısız tüm ürünlerimizi keşfedin</p>
  </div>

  <section class="section">
    <div class="container">
      <!-- Filtreler -->
      <div style="display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap;align-items:center">
        <select id="categoryFilter" class="form-control" style="width:auto;min-width:180px">
          <option value="">Tüm Kategoriler</option>
        </select>
        <select id="sortFilter" class="form-control" style="width:auto;min-width:180px">
          <option value="">Varsayılan Sıralama</option>
          <option value="price_asc">Fiyat: Düşükten Yükseğe</option>
          <option value="price_desc">Fiyat: Yüksekten Düşüğe</option>
          <option value="newest">En Yeni</option>
        </select>
        <input type="text" id="searchInput" class="form-control" placeholder="Ürün ara..." style="width:auto;min-width:220px">
      </div>

      <div class="products-grid" id="productsGrid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">

      <div class="footer-bottom">&copy; 2026 Ankazen. Tüm hakları saklıdır.</div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);

    async function loadCategories() {
      const categories = await API.get('/products/categories');
      const select = document.getElementById('categoryFilter');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
      if (params.get('category')) select.value = params.get('category');
    }

    async function loadProducts() {
      const category = document.getElementById('categoryFilter').value;
      const sort = document.getElementById('sortFilter').value;
      const search = document.getElementById('searchInput').value;

      let url = '/products?';
      if (category) url += `category=${category}&`;
      if (sort) url += `sort=${sort}&`;
      if (search) url += `search=${encodeURIComponent(search)}&`;

      const products = await API.get(url);
      const grid = document.getElementById('productsGrid');

      if (products.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <i class="bi bi-search"></i><h3>Ürün bulunamadı</h3>
          <p>Filtreleri değiştirerek tekrar deneyin.</p></div>`;
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <a href="/product-detail.html?slug=${p.slug}" class="product-card-image">
            ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<i class="bi bi-image placeholder-icon"></i>`}
            ${p.is_featured ? '<span class="product-badge">Popüler</span>' : ''}
          </a>
          <div class="product-card-body">
            <div class="product-card-category">${p.category_name || ''}</div>
            <h3><a href="/product-detail.html?slug=${p.slug}">${p.name}</a></h3>
            <div class="product-price">
              <span class="current">${formatPrice(p.price)}</span>
              ${p.old_price ? `<span class="old">${formatPrice(p.old_price)}</span>` : ''}
            </div>
            ${p.weight ? `<div class="product-weight">${p.weight}</div>` : ''}
          </div>
          <div class="product-card-footer">
            <button class="btn btn-accent btn-block btn-sm" onclick="addToCart(${p.id})">
              <i class="bi bi-cart-plus"></i> Sepete Ekle
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('categoryFilter').addEventListener('change', loadProducts);
    document.getElementById('sortFilter').addEventListener('change', loadProducts);

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadProducts, 400);
    });

    loadCategories().then(loadProducts);
  </script>
</body>
</html>
