<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilim - Ankazen</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="slogan-banner">
    <div class="slogan-text">
      <span>Emekten Bereket, Gelenekten Gelecek</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><img src="/images/logo.jpg" alt="Ankazen" class="navbar-logo"></a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/products.html">Ürünler</a></li>
        <li><a href="/blog.html">Blog</a></li>
      </ul>
      <div class="nav-actions"></div>
      <button class="mobile-toggle" onclick="toggleMobileMenu()"><i class="bi bi-list"></i></button>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="profile-grid">
        <div class="profile-sidebar">
          <div class="user-info">
            <div class="user-avatar"><i class="bi bi-person"></i></div>
            <h3 id="userName">...</h3>
            <p style="color:var(--text-light);font-size:0.85rem" id="userEmail">...</p>
          </div>
          <ul class="profile-menu">
            <li><a href="/profile.html" class="active"><i class="bi bi-person"></i> Profil Bilgileri</a></li>
            <li><a href="/orders.html"><i class="bi bi-box-seam"></i> Siparişlerim</a></li>
            <li><a href="#" onclick="Auth.logout();return false;"><i class="bi bi-box-arrow-right"></i> Çıkış Yap</a></li>
          </ul>
        </div>
        <div class="profile-content">
          <h2 style="margin-bottom:24px;color:var(--primary)">Profil Bilgileri</h2>
          <div id="alertBox"></div>
          <form id="profileForm">
            <div class="form-group">
              <label>Ad Soyad</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="form-group">
              <label>Telefon</label>
              <input type="tel" class="form-control" id="phone">
            </div>
            <div class="form-group">
              <label>Şehir</label>
              <input type="text" class="form-control" id="city">
            </div>
            <div class="form-group">
              <label>Adres</label>
              <textarea class="form-control" id="address"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Güncelle</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/app.js"></script>
  <script>
    if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; }

    async function loadProfile() {
      try {
        const user = await API.get('/auth/me');
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('name').value = user.name || '';
        document.getElementById('phone').value = user.phone || '';
        document.getElementById('city').value = user.city || '';
        document.getElementById('address').value = user.address || '';
      } catch (e) { showToast(e.message, 'error'); }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await API.put('/auth/me', {
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          city: document.getElementById('city').value,
          address: document.getElementById('address').value
        });
        const user = Auth.getUser();
        user.name = document.getElementById('name').value;
        localStorage.setItem('user', JSON.stringify(user));
        showToast('Profil güncellendi!');
        updateNavbar();
      } catch (e) {
        document.getElementById('alertBox').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    });

    loadProfile();
  </script>
</body>
</html>
