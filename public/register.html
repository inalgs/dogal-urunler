<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol - Ankazen</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="slogan-banner">
    <div class="slogan-text">
      <span>Emekten Bereket, Gelenekten Gelecek</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><img src="/images/logo.jpg" alt="Ankazen" class="navbar-logo"></a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/products.html">Ürünler</a></li>
      </ul>
      <div class="nav-actions"></div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Kayıt Ol</h2>
      <p class="subtitle">Yeni hesap oluşturun</p>
      <div id="alertBox"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Ad Soyad</label>
          <input type="text" class="form-control" id="name" placeholder="Adınız Soyadınız" required>
        </div>
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" class="form-control" id="email" placeholder="ornek@email.com" required>
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input type="tel" class="form-control" id="phone" placeholder="0555 555 5555">
        </div>
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" class="form-control" id="password" placeholder="En az 6 karakter" minlength="6" required>
        </div>
        <div class="form-group">
          <label>Şifre Tekrar</label>
          <input type="password" class="form-control" id="password2" placeholder="Şifrenizi tekrar girin" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Kayıt Ol</button>
      </form>
      <div class="switch-link">
        Zaten hesabınız var mı? <a href="/login.html">Giriş Yap</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password !== password2) {
        alertBox.innerHTML = '<div class="alert alert-error">Şifreler eşleşmiyor</div>';
        return;
      }

      try {
        const data = await API.post('/auth/register', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password
        });
        Auth.login(data.token, data.user);
        showToast('Kayıt başarılı!');
        setTimeout(() => window.location.href = '/', 500);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
