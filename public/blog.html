<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Ankazen</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="slogan-banner">
    <div class="slogan-text">
      <span>Emekten Bereket, Gelenekten Gelecek</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand"><img src="/images/logo.jpg" alt="Ankazen" class="navbar-logo"></a>
      <ul class="nav-links">
        <li><a href="/">Ana Sayfa</a></li>
        <li><a href="/products.html">Ürünler</a></li>
        <li><a href="/blog.html">Blog</a></li>
        <li><a href="/about.html">Hakkımızda</a></li>
        <li><a href="/contact.html">İletişim</a></li>
      </ul>
      <div class="nav-actions"></div>
      <button class="mobile-toggle" onclick="toggleMobileMenu()"><i class="bi bi-list"></i></button>
    </div>
  </nav>

  <div class="page-header">
    <h1>Doğal Yaşam Blogu</h1>
    <p>Tarifler, sağlık ipuçları ve doğal yaşam rehberi</p>
  </div>

  <section class="section">
    <div class="container">
      <div class="blog-grid" id="blogGrid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">

      <div class="footer-bottom">&copy; 2026 Ankazen. Tüm hakları saklıdır.</div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script>
    async function loadBlog() {
      try {
        const posts = await API.get('/blog');
        const grid = document.getElementById('blogGrid');
        if (posts.length === 0) {
          grid.innerHTML = '<div class="empty-state"><i class="bi bi-journal-text"></i><h3>Henüz blog yazısı yok</h3></div>';
          return;
        }
        grid.innerHTML = posts.map(post => `
          <a href="/blog-detail.html?slug=${post.slug}" class="blog-card">
            <div class="blog-card-image">
              ${post.image ? `<img src="${post.image}" alt="${post.title}">` : `<i class="bi bi-journal-text" style="font-size:3rem;color:var(--border)"></i>`}
            </div>
            <div class="blog-card-body">
              <div class="blog-card-date"><i class="bi bi-calendar3"></i> ${formatDate(post.created_at)} ${post.author_name ? `| ${post.author_name}` : ''}</div>
              <h3>${post.title}</h3>
              <p>${post.summary || ''}</p>
              <span class="btn btn-sm btn-outline">Devamını Oku <i class="bi bi-arrow-right"></i></span>
            </div>
          </a>
        `).join('');
      } catch (e) {
        document.getElementById('blogGrid').innerHTML = '<p>Blog yazıları yüklenemedi.</p>';
      }
    }
    loadBlog();
  </script>
</body>
</html>
